<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEA-Agent Platform v9.0</title>
<!-- Vendored locally so the app has no external CDN dependency (works in
     network-restricted deployments; avoids blocking on unreachable CDNs). -->
<link rel="stylesheet" href="/static/tailwind.css?v={{ asset_ver }}">
<script src="/static/chart.umd.min.js"></script>
<script src="/static/xlsx.full.min.js"></script>
<style>
  * { font-family: 'Noto Sans KR', -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  :root { --green: #006600; --green-light: #e8f5e8; --green-mid: #4a9e4a; }
  .tab-active { border-bottom: 3px solid var(--green); color: var(--green); background: var(--green-light); font-weight: 700; }
  .tab-inactive { border-bottom: 3px solid transparent; color: #64748b; }
  .tab-inactive:hover { color: var(--green); background: #f8faf8; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; }
  .input-field { width:100%; padding: 7px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; outline:none; transition: border 0.2s; }
  .input-field:focus { border-color: var(--green); }
  .btn-primary { background: var(--green); color: #fff; border:none; border-radius: 8px; padding: 10px 24px; font-weight: 700; cursor: pointer; font-size: 14px; }
  .btn-primary:hover { background: #005500; }
  .btn-secondary { background: #fff; color: var(--green); border: 2px solid var(--green); border-radius: 8px; padding: 8px 20px; font-weight: 600; cursor: pointer; font-size: 13px; }
  .btn-sm { padding: 4px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; }
  .btn-danger { background: #fee2e2; color: #dc2626; border:none; border-radius: 6px; padding: 4px 12px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--green); margin-bottom: 10px; }
  .collapsible-header { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
  .collapsible-header .arrow { font-size: 10px; transition: transform 0.2s; color: #94a3b8; }
  .collapsible-header .arrow.open { transform: rotate(90deg); }
  .result-positive { color: var(--green); }
  .result-negative { color: #dc2626; }
  table.tea-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.tea-table th { background: var(--green); color: #fff; padding: 8px 12px; text-align: right; border: 1px solid #005500; }
  table.tea-table th:first-child { text-align: left; }
  table.tea-table td { padding: 6px 12px; border: 1px solid #e2e8f0; text-align: right; }
  table.tea-table td:first-child { text-align: left; }
  table.tea-table tr.section-header td { background: #f0f9f0; font-weight: 700; color: var(--green); }
  table.tea-table tr.total-row td { background: #edf7ed; font-weight: 700; color: var(--green); font-size: 13px; }
  table.tea-table tr:hover { background: #fafffe; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal-content { background: #fff; border-radius: 12px; max-height: 80vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .drop-zone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 40px; text-align: center; transition: all 0.3s; }
  .drop-zone.dragover { border-color: var(--green); background: var(--green-light); }
  canvas { max-height: 300px; }
  /* BFD Container */
  #bfd-container { border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; overflow: hidden; }
  .bfd-node { position: absolute; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: move; user-select: none; border: 2px solid rgba(0,0,0,0.15); min-width: 100px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .bfd-node.selected { border: 2px solid #006600; box-shadow: 0 0 0 3px rgba(0,102,0,0.2); }
  /* Chat Panel */
  .chat-toggle { position:fixed; bottom:24px; right:24px; width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#006600,#004d00); color:#fff; border:none; cursor:pointer; font-size:24px; box-shadow:0 4px 16px rgba(0,102,0,0.4); z-index:100; display:flex; align-items:center; justify-content:center; transition:transform 0.2s; }
  .chat-toggle:hover { transform:scale(1.1); }
  .chat-panel { position:fixed; bottom:90px; right:24px; width:420px; height:560px; background:#fff; border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,0.2); z-index:150; display:flex; flex-direction:column; overflow:hidden; border:1px solid #e2e8f0; min-width:300px; min-height:280px; }
  /* Resize handles */
  .chat-rz { position:absolute; z-index:30; }
  .chat-rz-w  { top:16px; left:0; bottom:16px; width:6px; cursor:ew-resize; }
  .chat-rz-n  { top:0; left:16px; right:16px; height:6px; cursor:ns-resize; }
  .chat-rz-nw { top:0; left:0; width:18px; height:18px; cursor:nw-resize; }
  .chat-rz:hover { background:rgba(0,102,0,0.12); border-radius:3px; }
  /* Grip icon in header */
  .chat-grip { width:18px; height:32px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3px; cursor:nw-resize; opacity:0.5; flex-shrink:0; margin-right:8px; }
  .chat-grip span { display:block; width:12px; height:2px; background:#fff; border-radius:1px; }
  .chat-header { background:linear-gradient(135deg,#006600,#004d00); color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
  .chat-messages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; background:#f8faf8; }
  .chat-msg { max-width:85%; padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.6; word-break:break-word; }
  .chat-msg.user { align-self:flex-end; background:var(--green); color:#fff; border-bottom-right-radius:4px; }
  .chat-msg.assistant { align-self:flex-start; background:#fff; color:#1a202c; border:1px solid #e2e8f0; border-bottom-left-radius:4px; }
  .chat-msg.assistant .action-btn { display:inline-block; margin-top:8px; padding:4px 12px; background:var(--green-light); color:var(--green); border:1px solid var(--green); border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; }
  .chat-msg.assistant .source-tag { display:inline-block; margin-top:6px; padding:2px 8px; background:#f1f5f9; border-radius:4px; font-size:10px; color:#64748b; }
  .chat-input-area { padding:12px; border-top:1px solid #e2e8f0; background:#fff; display:flex; gap:8px; }
  .chat-input-area input { flex:1; padding:10px 14px; border:1px solid #e2e8f0; border-radius:8px; font-size:13px; outline:none; }
  .chat-input-area input:focus { border-color:var(--green); }
  .chat-input-area button { padding:10px 16px; background:var(--green); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; }
  .chat-quick-btns { padding:6px 12px; display:flex; gap:6px; flex-wrap:wrap; background:#fff; border-top:1px solid #f1f5f9; }
  .chat-quick-btns button { padding:4px 10px; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:6px; font-size:11px; cursor:pointer; color:#4a5568; }
  .chat-quick-btns button:hover { background:var(--green-light); color:var(--green); border-color:var(--green); }
  .chat-typing span { animation:blink 1.4s infinite; }
  .chat-typing span:nth-child(2) { animation-delay:0.2s; }
  .chat-typing span:nth-child(3) { animation-delay:0.4s; }
  @keyframes blink { 0%,100%{opacity:0.2} 50%{opacity:1} }
  /* Global tooltip */
  #g-tooltip { position:fixed; pointer-events:none; z-index:9999; background:#1e293b; color:#f8fafc; font-size:11.5px; padding:8px 14px; border-radius:8px; max-width:280px; line-height:1.6; display:none; box-shadow:0 6px 20px rgba(0,0,0,0.3); }
  #g-tooltip::before { content:''; position:absolute; bottom:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-bottom-color:#1e293b; }
  /* Workflow banner */
  .flow-banner { display:flex; align-items:center; gap:6px; padding:8px 20px; background:linear-gradient(135deg,#f0fdf4,#ecfdf5); border-bottom:1px solid #bbf7d0; flex-wrap:wrap; font-size:11px; }
  .flow-chip { display:inline-flex; align-items:center; gap:3px; padding:3px 10px; border-radius:12px; font-weight:700; cursor:pointer; transition:filter 0.15s; border:1px solid; white-space:nowrap; }
  .flow-chip:hover { filter:brightness(0.92); transform:translateY(-1px); }
  .flow-chip.c-core { background:#dcfce7; color:#15803d; border-color:#86efac; }
  .flow-chip.c-prep { background:#ede9fe; color:#6d28d9; border-color:#c4b5fd; }
  .flow-chip.c-db { background:#fef3c7; color:#92400e; border-color:#fde68a; }
  .flow-chip.c-vis { background:#dbeafe; color:#1d4ed8; border-color:#93c5fd; }
  .flow-chip.c-mgmt { background:#f1f5f9; color:#475569; border-color:#cbd5e1; }
  /* Tab step number */
  .tab-num { display:block; font-size:8.5px; font-weight:800; letter-spacing:0.4px; line-height:1; margin-bottom:2px; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div id="app"></div>
<div id="g-tooltip"></div>
<script src="/static/app.js?v={{ asset_ver }}"></script>
</body>
</html>
